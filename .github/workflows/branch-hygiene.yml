name: Repository Branch Hygiene

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

jobs:
  audit:
    name: Verify retired heads and exact nine-branch budget
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify closed PR heads remain addressable by immutable SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          verify_retired_head() {
            local pr_number="$1"
            local expected_sha="$2"
            local pr state head_sha actual_sha
            pr="$(gh api "repos/$REPO/pulls/$pr_number")"
            state="$(jq -r '.state' <<<"$pr")"
            head_sha="$(jq -r '.head.sha' <<<"$pr")"
            if [[ "$state" != "closed" || "$head_sha" != "$expected_sha" ]]; then
              echo "::error::PR $pr_number state/head mismatch; refusing to record an unexpected head."
              exit 1
            fi
            actual_sha="$(gh api "repos/$REPO/commits/$expected_sha" --jq '.sha')"
            [[ "$actual_sha" == "$expected_sha" ]]
            echo "RETIRED HEAD VERIFIED: PR #$pr_number -> $expected_sha"
          }
          verify_retired_head 105 "80e435d0d27a0c163b1eb11ed19d19c6f0584421"
          verify_retired_head 106 "33a4da55542638c6baabc8c4eac83b5abd8d8d46"
          verify_retired_head 107 "80f2e2867eddba1b51bb4e033388f19db2bfab19"

      - name: Verify exact canonical remote branch inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          canonical=(
            "main"
            "feat/knowledge-graph-next"
            "feat/space-time-next"
            "feat/research-intelligence-next"
            "feat/ai-agent-infrastructure"
            "feat/multisurface-adapters"
            "feat/api-sdk-contracts"
            "feat/security-release-engineering"
            "feat/field-acquisition"
          )
          mapfile -t branches < <(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | sort -u)
          echo "Remote branch count: ${#branches[@]}"
          printf '%s\n' "${branches[@]}"
          [[ "${#branches[@]}" -eq 9 ]] || { echo "::error::Expected exactly nine active branches."; exit 1; }
          for branch in "${canonical[@]}"; do
            printf '%s\n' "${branches[@]}" | grep -Fxq "$branch" || { echo "::error::Missing canonical branch: $branch"; exit 1; }
          done
          for branch in "${branches[@]}"; do
            printf '%s\n' "${canonical[@]}" | grep -Fxq "$branch" || { echo "::error::Non-canonical branch remains: $branch"; exit 1; }
          done
          echo "Branch hygiene PASS: all retired heads verified; exactly nine canonical branches remain."
