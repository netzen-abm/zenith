name: Repository Branch Hygiene

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-hygiene
  cancel-in-progress: true

jobs:
  retire-safe-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Archive and retire non-canonical branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          protected=(
            "main"
            "feat/knowledge-graph-next"
            "feat/space-time-next"
            "feat/research-intelligence-next"
            "feat/ai-agent-infrastructure"
            "feat/multisurface-adapters"
            "feat/api-sdk-contracts"
            "feat/security-release-engineering"
            "feat/field-acquisition"
          )

          is_protected() {
            local candidate="$1"
            for branch in "${protected[@]}"; do
              [[ "$candidate" == "$branch" ]] && return 0
            done
            return 1
          }

          mapfile -t branches < <(
            gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name'
          )
          mapfile -t open_pr_branches < <(
            gh pr list --repo "$REPO" --state open --json headRefName --jq '.[].headRefName'
          )

          is_open_pr_branch() {
            local candidate="$1"
            for open_branch in "${open_pr_branches[@]}"; do
              [[ "$candidate" == "$open_branch" ]] && return 0
            done
            return 1
          }

          resolve_tag_commit() {
            local tag_ref="$1"
            local object_json object_type object_sha
            object_json=$(gh api "repos/$REPO/git/ref/tags/$tag_ref")
            object_type=$(jq -r '.object.type' <<< "$object_json")
            object_sha=$(jq -r '.object.sha' <<< "$object_json")
            if [[ "$object_type" == "tag" ]]; then
              gh api "repos/$REPO/git/tags/$object_sha" --jq '.object.sha'
            else
              printf '%s' "$object_sha"
            fi
          }

          deleted=0
          retained=0
          archived=0

          for branch in "${branches[@]}"; do
            if is_protected "$branch"; then
              echo "KEEP protected: $branch"
              continue
            fi

            if is_open_pr_branch "$branch"; then
              echo "KEEP open-PR branch: $branch"
              retained=$((retained + 1))
              continue
            fi

            branch_sha=$(gh api "repos/$REPO/branches/$branch" --jq '.commit.sha')
            archive_tag="archive/branches/${branch//\//--}"

            if gh api "repos/$REPO/git/ref/tags/$archive_tag" >/dev/null 2>&1; then
              archived_sha=$(resolve_tag_commit "$archive_tag")
              if [[ "$archived_sha" != "$branch_sha" ]]; then
                echo "::error::Archive tag $archive_tag exists at $archived_sha, expected $branch_sha; RETAIN branch."
                retained=$((retained + 1))
                continue
              fi
              echo "ARCHIVE already verified: $archive_tag -> $branch_sha"
            else
              if ! gh api --method POST "repos/$REPO/git/refs" \
                -f "ref=refs/tags/$archive_tag" \
                -f "sha=$branch_sha" >/dev/null; then
                echo "::error::Archive creation failed for $branch; RETAIN branch."
                retained=$((retained + 1))
                continue
              fi
              archived=$((archived + 1))
              echo "ARCHIVE created: $archive_tag -> $branch_sha"
            fi

            verified_sha=$(resolve_tag_commit "$archive_tag")
            if [[ "$verified_sha" != "$branch_sha" ]]; then
              echo "::error::Archive verification failed for $branch: $verified_sha != $branch_sha; RETAIN branch."
              retained=$((retained + 1))
              continue
            fi

            if gh api --method DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null; then
              echo "DELETE archived non-canonical branch: $branch"
              deleted=$((deleted + 1))
            else
              echo "::error::Deletion failed for $branch; archive retained."
              retained=$((retained + 1))
            fi
          done

          remaining=$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq 'length' | awk '{s += $1} END {print s+0}')
          echo "Branch hygiene result: archived=$archived deleted=$deleted retained=$retained remaining=$remaining protected=9"

          if [[ "$remaining" -ne 9 ]]; then
            echo "::error::Repository branch count is $remaining; target is exactly 9."
            exit 1
          fi
\t' read -r branch branch_sha <<< "$record"

            if is_protected "$branch"; then
              echo "KEEP protected: $branch"
              continue
            fi

            if is_open_pr_branch "$branch"; then
              echo "KEEP open-PR branch: $branch"
              retained=$((retained + 1))
              continue
            fi

            archive_tag="archive/branches/${branch//\//--}"

            if git ls-remote --exit-code --refs origin "refs/tags/$archive_tag" >/dev/null 2>&1; then
              archived_sha=$(resolve_tag_commit "$archive_tag")
              if [[ "$archived_sha" != "$branch_sha" ]]; then
                echo "::error::Archive tag $archive_tag exists at $archived_sha, expected $branch_sha; RETAIN branch."
                retained=$((retained + 1))
                continue
              fi
              echo "ARCHIVE already verified: $archive_tag -> $branch_sha"
            else
              if ! gh api --method POST "repos/$REPO/git/refs" \
                -f "ref=refs/tags/$archive_tag" \
                -f "sha=$branch_sha"; then
                echo "::error::Archive creation failed for $branch; RETAIN branch."
                retained=$((retained + 1))
                continue
              fi
              archived=$((archived + 1))
              echo "ARCHIVE created: $archive_tag -> $branch_sha"
            fi

            verified_sha=$(resolve_tag_commit "$archive_tag")
            if [[ "$verified_sha" != "$branch_sha" ]]; then
              echo "::error::Archive verification failed for $branch: $verified_sha != $branch_sha; RETAIN branch."
              retained=$((retained + 1))
              continue
            fi

            if gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"; then
              echo "DELETE archived non-canonical branch: $branch"
              deleted=$((deleted + 1))
            else
              echo "::error::Deletion failed for $branch; archive retained."
              retained=$((retained + 1))
            fi
          done

          remaining=$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq 'length' | awk '{s += $1} END {print s+0}')
          echo "Branch hygiene result: archived=$archived deleted=$deleted retained=$retained remaining=$remaining protected=9"

          if [[ "$remaining" -ne 9 ]]; then
            echo "::error::Repository branch count is $remaining; target is exactly 9."
            exit 1
          fi
