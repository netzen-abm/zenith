name: Repository Branch Hygiene

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: branch-hygiene
  cancel-in-progress: true

jobs:
  audit:
    name: Audit exact nine-branch budget
    runs-on: ubuntu-latest
    steps:
      - name: Verify canonical remote inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          protected=(
            "main"
            "feat/knowledge-graph-next"
            "feat/space-time-next"
            "feat/research-intelligence-next"
            "feat/ai-agent-infrastructure"
            "feat/multisurface-adapters"
            "feat/api-sdk-contracts"
            "feat/security-release-engineering"
            "feat/field-acquisition"
          )

          mapfile -t branches < <(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name')
          echo "Remote branch count: ${#branches[@]}"

          unexpected=()
          for branch in "${branches[@]}"; do
            if printf '%s\n' "${protected[@]}" | grep -Fxq "$branch"; then
              echo "KEEP canonical: $branch"
            else
              unexpected+=("$branch")
              echo "NON-CANONICAL: $branch"
            fi
          done

          if [[ "${#branches[@]}" -ne 9 ]]; then
            echo "::error::Repository hygiene violation: expected exactly 9 active branches, found ${#branches[@]}."
            exit 1
          fi

          if [[ "${#unexpected[@]}" -ne 0 ]]; then
            echo "::error::Non-canonical branches remain."
            exit 1
          fi

          echo "Branch hygiene PASS: exactly nine canonical branches remain."
