name: Repository Branch Hygiene

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

jobs:
  retire-safe-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Retire branches safely
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          protected=(
            "main"
            "feat/knowledge-graph-next"
            "feat/space-time-next"
            "feat/research-intelligence-next"
            "feat/ai-agent-infrastructure"
            "feat/multisurface-adapters"
            "feat/api-sdk-contracts"
            "feat/security-release-engineering"
            "feat/field-acquisition"
          )

          is_protected() {
            local candidate="$1"
            for branch in "${protected[@]}"; do
              [[ "$candidate" == "$branch" ]] && return 0
            done
            return 1
          }

          mapfile -t branches < <(
            gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name'
          )

          deleted=0
          retained=0

          git fetch origin main --prune

          for branch in "${branches[@]}"; do
            if is_protected "$branch"; then
              echo "KEEP protected: $branch"
              continue
            fi

            if ! git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" --quiet; then
              echo "RETAIN fetch-failed: $branch"
              retained=$((retained + 1))
              continue
            fi

            repo_owner="${REPO%%/*}"
            head_ref="${repo_owner}:$branch"

            open_prs=$(gh pr list --repo "$REPO" --state open --head "$head_ref" --json number --jq 'length')
            if [[ "$open_prs" != "0" ]]; then
              echo "KEEP open-PR branch: $branch"
              retained=$((retained + 1))
              continue
            fi

            merged_prs=$(gh pr list --repo "$REPO" --state merged --head "$head_ref" --json number --jq 'length')
            if [[ "$merged_prs" != "0" ]]; then
              echo "DELETE merged-PR branch: $branch"
              gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
              deleted=$((deleted + 1))
              continue
            fi

            mapfile -t cherry_status < <(git cherry origin/main "origin/$branch")
            unique=0
            for entry in "${cherry_status[@]}"; do
              [[ "$entry" == +* ]] && unique=$((unique + 1))
            done

            if [[ "$unique" == "0" ]]; then
              echo "DELETE patch-equivalent branch: $branch"
              gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
              deleted=$((deleted + 1))
            else
              echo "RETAIN unique unmerged work: $branch (unique_commits=$unique)"
              retained=$((retained + 1))
            fi
          done

          remaining=$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq 'length' | awk '{s += $1} END {print s+0}')
          echo "Branch hygiene result: deleted=$deleted retained=$retained remaining=$remaining protected=9"

          if [[ "$remaining" -ne 9 ]]; then
            echo "::error::Repository branch count is $remaining; target is exactly 9."
            exit 1
          fi
