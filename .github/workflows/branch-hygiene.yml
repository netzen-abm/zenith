name: Repository Branch Hygiene Audit

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-hygiene
  cancel-in-progress: true

jobs:
  retire-safe-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Archive and retire non-canonical branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          protected=(
            "main"
            "feat/knowledge-graph-next"
            "feat/space-time-next"
            "feat/research-intelligence-next"
            "feat/ai-agent-infrastructure"
            "feat/multisurface-adapters"
            "feat/api-sdk-contracts"
            "feat/security-release-engineering"
            "feat/field-acquisition"
          )

          is_protected() {
            local candidate="$1"
            for branch in "${protected[@]}"; do
              [[ "$candidate" == "$branch" ]] && return 0
            done
            return 1
          }

          mapfile -t branches < <(
            gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name'
          )
          mapfile -t open_pr_branches < <(
            gh pr list --repo "$REPO" --state open --json headRefName --jq '.[].headRefName'
          )

          is_open_pr_branch() {
            local candidate="$1"
            for open_branch in "${open_pr_branches[@]}"; do
              [[ "$candidate" == "$open_branch" ]] && return 0
            done
            return 1
          }

          unexpected=0

          for branch in "${branches[@]}"; do
            if is_protected "$branch"; then
              echo "KEEP canonical: $branch"
            elif is_open_pr_branch "$branch"; then
              echo "KEEP open PR: $branch"
              retained=$((retained + 1))
            else
              echo "NON-CANONICAL PENDING COLLECTIVE RETIREMENT: $branch"
              unexpected=$((unexpected + 1))
            fi
          done

          remaining=$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq 'length' | awk '{s += $1} END {print s+0}')
          echo "Branch hygiene audit: noncanonical=$unexpected retained_open_pr=$retained remaining=$remaining target=9"
          if [[ "$remaining" -lt 9 ]]; then
            echo "::error::Repository has fewer than nine branches."
            exit 1
          fi
