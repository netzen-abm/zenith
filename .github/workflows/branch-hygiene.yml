name: Repository Branch Hygiene

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

jobs:
  retire-safe-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Archive and retire non-canonical branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          protected=(
            "main"
            "feat/knowledge-graph-next"
            "feat/space-time-next"
            "feat/research-intelligence-next"
            "feat/ai-agent-infrastructure"
            "feat/multisurface-adapters"
            "feat/api-sdk-contracts"
            "feat/security-release-engineering"
            "feat/field-acquisition"
          )

          is_protected() {
            local candidate="$1"
            for branch in "${protected[@]}"; do
              [[ "$candidate" == "$branch" ]] && return 0
            done
            return 1
          }

          mapfile -t branches < <(
            gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name'
          )

          deleted=0
          retained=0
          archived=0

          git fetch origin main --prune

          for branch in "${branches[@]}"; do
            if is_protected "$branch"; then
              echo "KEEP protected: $branch"
              continue
            fi

            if ! git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" --quiet; then
              echo "RETAIN fetch-failed: $branch"
              retained=$((retained + 1))
              continue
            fi

            repo_owner="${REPO%%/*}"
            head_ref="$repo_owner:$branch"

            open_prs=$(gh pr list --repo "$REPO" --state open --head "$head_ref" --json number --jq 'length')
            if [[ "$open_prs" != "0" ]]; then
              echo "KEEP open-PR branch: $branch"
              retained=$((retained + 1))
              continue
            fi

            branch_sha=$(git rev-parse "origin/$branch")
            archive_tag="archive/branches/${branch//\//--}"

            if git ls-remote --exit-code --refs origin "refs/tags/$archive_tag" >/dev/null 2>&1; then
              tag_sha=$(git ls-remote origin "refs/tags/$archive_tag" | awk '{print $1}')
              if [[ "$tag_sha" != "$branch_sha" ]]; then
                echo "::error::Archive tag $archive_tag already exists at $tag_sha, expected $branch_sha."
                exit 1
              fi
              echo "ARCHIVE already present: $archive_tag -> $branch_sha"
            else
              git tag -a "$archive_tag" "$branch_sha" -m "Archive retired branch $branch at $branch_sha"
              git push origin "$archive_tag"
              echo "ARCHIVE created: $archive_tag -> $branch_sha"
              archived=$((archived + 1))
            fi

            echo "DELETE archived non-canonical branch: $branch"
            gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
            deleted=$((deleted + 1))
          done

          remaining=$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq 'length' | awk '{s += $1} END {print s+0}')
          echo "Branch hygiene result: archived=$archived deleted=$deleted retained=$retained remaining=$remaining protected=9"

          if [[ "$remaining" -ne 9 ]]; then
            echo "::error::Repository branch count is $remaining; target is exactly 9."
            exit 1
          fi
