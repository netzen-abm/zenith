name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate required architecture paths
        shell: bash
        run: |
          set -euo pipefail
          for path in README.md core/database docs tests; do
            test -e "$path"
          done

      - name: Enforce pinned GitHub Actions
        shell: bash
        run: |
          set -euo pipefail
          if grep -REn '^[[:space:]]*uses:[[:space:]]*[^@]+@(v|main|master|latest|[0-9]+$)' .github/workflows; then
            echo "ERROR: every third-party GitHub Action must be pinned to an immutable commit SHA."
            exit 1
          fi

      - name: Validate authorization boundary when present
        shell: bash
        run: |
          set -euo pipefail
          file="core/database/migrations/0002_capability_policy_boundary.sql"
          if [ ! -f "$file" ]; then
            echo "Authorization-boundary migration is not yet present on this branch; dedicated authorization validation remains gated by its implementation PR."
            exit 0
          fi
          grep -q "core.authorize_capability" "$file"
          grep -q "security invoker" "$file"
          grep -q "set search_path = ''" "$file"
          grep -q "revoke execute" "$file"
          grep -q "grant execute.*authenticated" "$file"

      - name: Validate architecture governance
        shell: bash
        run: |
          set -euo pipefail
          file="docs/ARCHITECTURE-GOVERNANCE.md"
          test -f "$file"
          grep -qi "TypeScript" "$file"
          grep -qi "Rust" "$file"
          grep -qi "Python" "$file"
          grep -qi "ADR" "$file"

      - name: Validate authorization ADR when boundary is present
        shell: bash
        run: |
          set -euo pipefail
          migration="core/database/migrations/0002_capability_policy_boundary.sql"
          adr="docs/adr/0001-canonical-capability-authorization-boundary.md"
          if [ ! -f "$migration" ]; then
            echo "Authorization implementation is not yet present; authorization ADR validation remains gated by its implementation PR."
            exit 0
          fi
          test -f "$adr"
          grep -qi "authorization" "$adr"
          grep -qi "RLS" "$adr"
          grep -qi "security" "$adr"

  capability-boundary:
    name: Capability architecture boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce capability boundary
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tests/architecture/capability-boundary.sh
          tests/architecture/capability-boundary.sh

  sql-static-security:
    name: SQL static security checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject unsafe authorization-boundary patterns when present
        shell: bash
        run: |
          set -euo pipefail
          file="core/database/migrations/0002_capability_policy_boundary.sql"
          if [ ! -f "$file" ]; then
            echo "Authorization-boundary migration is not yet present on this branch; no production SQL security assertion is applicable yet."
            exit 0
          fi
          ! grep -Eqi "grant execute on function core\.authorize_capability.*public" "$file"
          grep -Eqi "security invoker" "$file"
          grep -Eqi "set search_path = ''" "$file"

      - name: Check migration files are present
        shell: bash
        run: |
          set -euo pipefail
          find core/database/migrations -maxdepth 1 -type f -name '*.sql' | sort | grep -q .

  fresh-db-reconciliation:
    name: Fresh DB reconciliation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: zenith
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zenith"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Execute fresh migration reconciliation
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zenith
        run: |
          set -euo pipefail
          chmod +x tests/database/fresh-db-reconciliation.sh
          tests/database/fresh-db-reconciliation.sh

      - name: Verify Node.js runtime for database-backed coordinator test
        run: node --version

      - name: Run PostgreSQL-backed execution coordinator E2E
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zenith
        run: node --experimental-strip-types tests/database/postgres-execution-coordinator-e2e.test.ts

      - name: Run Evidence Annotation PostgreSQL E2E (mandatory)
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zenith
        run: node --experimental-strip-types tests/database/evidence-annotation-e2e.test.ts

      - name: Run operations concurrency assertions (mandatory)
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zenith
        run: |
          set -euo pipefail
          chmod +x tests/database/operations-concurrency.sh
          echo "==> executing mandatory operations concurrency gate"
          tests/database/operations-concurrency.sh
          echo "==> executing mandatory durable execution outcome concurrency gate"
          bash tests/database/execution-outcome-concurrency.sh

  operation-queue-tests:
    name: Operation queue tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Node.js runtime
        run: node --version
      - name: Run research intelligence query contract tests
        run: node --experimental-strip-types packages/capabilities/src/research-intelligence.test.ts

      - name: Run research execution integration tests
        run: node --experimental-strip-types packages/capabilities/src/research-operation.test.ts

      - name: Run research negative-path tests
        run: |
          node --experimental-strip-types packages/capabilities/src/research-operation-negative.test.ts
          node --experimental-strip-types packages/capabilities/src/research-provider-failure.test.ts

      - name: Run research durability failure tests
        run: |
          node --experimental-strip-types packages/capabilities/src/research-missing-query.test.ts
          node --experimental-strip-types packages/capabilities/src/research-outcome-failure.test.ts

      - name: Run Field Acquisition capability contract tests
        run: |
          node --experimental-strip-types packages/capabilities/src/field-acquisition.test.ts
          node --experimental-strip-types packages/capabilities/src/field-acquisition-operation.test.ts

      - name: Run operation queue invariant tests
        run: |
          node --experimental-strip-types packages/operation-queue/src/lifecycle.test.ts
          node --experimental-strip-types packages/operation-queue/src/execution-coordinator.test.ts
          node --experimental-strip-types packages/operation-queue/src/postgres-execution-reservation.test.ts
          node --experimental-strip-types packages/operation-queue/src/execution-kernel-conformance.test.ts

  branch-hygiene:
    name: Enforce exactly nine active branches
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Retire non-canonical branches safely
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          protected=(
            "main"
            "feat/knowledge-graph-next"
            "feat/space-time-next"
            "feat/research-intelligence-next"
            "feat/ai-agent-infrastructure"
            "feat/multisurface-adapters"
            "feat/api-sdk-contracts"
            "feat/security-release-engineering"
            "feat/field-acquisition"
          )

          is_protected() {
            local candidate="$1"
            for branch in "${protected[@]}"; do
              [[ "$candidate" == "$branch" ]] && return 0
            done
            return 1
          }

          mapfile -t branches < <(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name')
          mapfile -t open_pr_branches < <(gh pr list --repo "$REPO" --state open --json headRefName --jq '.[].headRefName')

          is_open_pr_branch() {
            local candidate="$1"
            for open_branch in "${open_pr_branches[@]}"; do
              [[ "$candidate" == "$open_branch" ]] && return 0
            done
            return 1
          }

          resolve_tag_commit() {
            local tag_ref="$1"
            local object_json object_type object_sha
            object_json=$(gh api "repos/$REPO/git/ref/tags/$tag_ref")
            object_type=$(jq -r '.object.type' <<< "$object_json")
            object_sha=$(jq -r '.object.sha' <<< "$object_json")
            if [[ "$object_type" == "tag" ]]; then
              gh api "repos/$REPO/git/tags/$object_sha" --jq '.object.sha'
            else
              printf '%s' "$object_sha"
            fi
          }

          archived=0
          deleted=0
          retained=0

          for branch in "${branches[@]}"; do
            if is_protected "$branch"; then
              continue
            fi
            if is_open_pr_branch "$branch"; then
              echo "RETAIN open PR: $branch"
              retained=$((retained + 1))
              continue
            fi

            branch_sha=$(gh api "repos/$REPO/branches/$branch" --jq '.commit.sha')
            archive_tag="archive/branches/${branch//\//--}"

            if gh api "repos/$REPO/git/ref/tags/$archive_tag" >/dev/null 2>&1; then
              archived_sha=$(resolve_tag_commit "$archive_tag")
              if [[ "$archived_sha" != "$branch_sha" ]]; then
                echo "::error::Archive collision for $branch: $archived_sha != $branch_sha"
                retained=$((retained + 1))
                continue
              fi
            else
              gh api --method POST "repos/$REPO/git/refs" -f "ref=refs/tags/$archive_tag" -f "sha=$branch_sha" >/dev/null
              archived=$((archived + 1))
            fi

            verified_sha=$(resolve_tag_commit "$archive_tag")
            if [[ "$verified_sha" != "$branch_sha" ]]; then
              echo "::error::Archive verification failed for $branch"
              retained=$((retained + 1))
              continue
            fi

            gh api --method DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null
            deleted=$((deleted + 1))
            echo "RETIRED: $branch -> $archive_tag -> $branch_sha"
          done

          remaining=$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq 'length' | awk '{s += $1} END {print s+0}')
          echo "Branch hygiene: archived=$archived deleted=$deleted retained=$retained remaining=$remaining target=9"
          [[ "$remaining" -eq 9 ]]
