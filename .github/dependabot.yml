version: 2
updates:
  # GitHub Actions are currently the automated dependency surface for ZENITH.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
        update-types:
          - "minor"
          - "patch"
